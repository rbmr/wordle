[project]
name = "wordle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.4",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "deptry>=0.23.1",
    "hatchling>=1.27.0",
    "isort>=7.0.0",
    "pytest>=8.4.2",
]

[project.scripts]
wordle-solver = "wordle.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

